:root{--bg:#0b0b0b;--bg2:#121212;--card:#171717;--card2:#1e1e1e;--line:#2a2a2a;--txt:#efe9dd;--muted:#a59f92;--gold:#f2ca50;--gold2:#d4af37;--gold3:#ffe088;--ok:#34d399;--err:#f87171;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
.serif{font-family:'Playfair Display',Georgia,serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.gold{background:linear-gradient(100deg,var(--gold3),var(--gold) 40%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;font-weight:600;letter-spacing:.2px;transition:.25s}
.btn-gold{background:linear-gradient(100deg,var(--gold3),var(--gold) 45%,var(--gold2));color:#1b1500;box-shadow:0 8px 28px rgba(212,175,55,.25)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(242,202,80,.35)}
.btn-ghost{border:1px solid var(--line);color:var(--txt);background:var(--card)}
.btn-ghost:hover{border-color:var(--gold2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1b1500}
.field{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none;transition:.2s}
textarea.field{height:auto;padding:12px 14px;resize:vertical}
.field:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
label.lb{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
/* topo */
.notice{background:linear-gradient(90deg,#1a1505,#2a2108,#1a1505);color:var(--gold3);text-align:center;font-size:12.5px;padding:8px 12px;letter-spacing:.3px}
header{position:sticky;top:0;z-index:40;background:rgba(11,11,11,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05)}
.hbar{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.brand b{font-family:'Playfair Display',serif;font-size:20px;letter-spacing:2px;font-weight:600}
.brand small{display:block;font-size:9px;letter-spacing:5px;color:var(--muted);margin-top:-3px}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search+.cartbtn{margin-left:0}
.search input{padding-left:40px;height:42px;border-radius:999px}
.search svg{position:absolute;left:14px;top:12px;opacity:.6}
.cartbtn{margin-left:auto;flex-shrink:0;position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--card)}
.cartbtn span{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#1b1500;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
@media(max-width:640px){.search{display:none}.brand b{font-size:17px}}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;margin:22px 0 10px;padding:64px 48px;background:radial-gradient(1200px 400px at 85% -10%,rgba(242,202,80,.22),transparent 60%),radial-gradient(600px 300px at 0% 120%,rgba(212,175,55,.12),transparent 60%),linear-gradient(160deg,#141414,#0d0d0d);border:1px solid rgba(242,202,80,.12)}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(34px,5.6vw,64px);line-height:1.05;font-weight:600;max-width:640px}
.hero h1 i{font-weight:400}
.hero p{color:var(--muted);max-width:520px;margin:18px 0 28px;font-size:16px}
.logo3d{position:absolute;right:40px;top:50%;margin-top:calc(min(34vw,360px) / -2);width:min(34vw,360px);aspect-ratio:1;perspective:1400px;z-index:2}
.logo3d-par{width:100%;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.logo3d-float{position:relative;width:100%;height:100%;animation:logoFloat 7s ease-in-out infinite}
.beam{position:absolute;inset:-3px;border-radius:27px;overflow:hidden;pointer-events:none;z-index:0}
.beam i{position:absolute;left:50%;top:50%;width:230%;aspect-ratio:1;margin:-115% 0 0 -115%;display:block;background:conic-gradient(from 0deg,transparent 0 58%,rgba(255,224,136,.18) 70%,#ffe088 82%,#f2ca50 89%,rgba(242,202,80,.18) 95%,transparent 100%);animation:beamSpin 4s linear infinite}
.beam::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 26px rgba(242,202,80,.22)}
@keyframes beamSpin{to{transform:rotate(360deg)}}
.logo3d-inner{position:relative;z-index:1;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.25,.8,.25,1);cursor:pointer}
.logo3d-face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:24px;opacity:.95;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(242,202,80,.18)}
.logo3d-back{transform:rotateY(180deg)}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.hero-txt{transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.skew-in{display:inline-block;transform-origin:bottom left;will-change:transform,opacity;backface-visibility:hidden}
.perks{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:28px;color:var(--muted);font-size:13px}
.perks div{display:flex;align-items:center;gap:8px}
.perks i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
@media(max-width:860px){.hero{padding:40px 22px 296px}.logo3d{top:auto;margin-top:0;bottom:30px;right:calc(50% - 120px);width:240px}}
@media(max-width:420px){.hero{padding:34px 18px 266px}.logo3d{bottom:26px;right:calc(50% - 105px);width:210px}}
@media (prefers-reduced-motion:reduce){.logo3d-float,.beam i{animation:none}}
/* catálogo */
.bar{display:flex;align-items:center;gap:10px;margin:30px 0 18px;flex-wrap:wrap}
.bar h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;margin-right:auto}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-bottom:60px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.3s;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:rgba(242,202,80,.35);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card .ph{aspect-ratio:1;background:radial-gradient(circle at 50% 30%,#2a2a2a,#151515);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:.5s}
.card:hover .ph img{transform:scale(1.05)}
.tag{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:4px 9px;border-radius:999px;background:rgba(11,11,11,.75);color:var(--gold3);border:1px solid rgba(242,202,80,.35)}
.tag.off{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.tag.out{left:auto;right:10px;color:var(--err);border-color:rgba(248,113,113,.4)}
.card .bd{padding:14px 14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .brandname{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .nm{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:8px}
.price b{font-size:18px;color:var(--gold)}
.price s{color:var(--muted);font-size:12.5px}
.ph-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:44px;color:rgba(242,202,80,.35)}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg2);z-index:61;transform:translateX(100%);transition:.35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{font-family:'Playfair Display',serif;font-size:22px;font-weight:600}
.x{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.db{flex:1;overflow-y:auto;padding:16px 20px}
.df{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line img,.line .ph-empty{width:68px;height:68px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#1d1d1d;font-size:22px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:34px}
.qty button{width:32px;height:100%;font-size:18px;color:var(--gold)}
.qty span{min-width:28px;text-align:center;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;z-index:62;width:min(980px,calc(100% - 24px));max-height:calc(100vh - 32px);overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:24px;transition:.3s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.pd{display:grid;grid-template-columns:1fr 1fr}
.pd .ph{aspect-ratio:1;background:radial-gradient(circle at 50% 30%,#2a2a2a,#121212)}
.pd .ph img{width:100%;height:100%;object-fit:cover}
.pd .info{padding:28px;display:flex;flex-direction:column;gap:14px}
.pd h2{font-family:'Playfair Display',serif;font-size:28px;line-height:1.15;font-weight:600}
@media(max-width:760px){.pd{grid-template-columns:1fr}.pd .info{padding:20px}.modal{top:auto;bottom:0;left:0;right:0;transform:translateY(20px);width:100%;max-height:92vh;border-radius:24px 24px 0 0}.modal.on{transform:none}}
.vars{display:flex;flex-wrap:wrap;gap:8px}
.vars button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.vars button.on{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.vars button[disabled]{opacity:.35;text-decoration:line-through}
/* checkout */
.page{padding:28px 0 60px}
.co{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start}
@media(max-width:900px){.co{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:22px}
.box h3{font-family:'Playfair Display',serif;font-size:21px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.box h3 em{font-style:normal;font-family:'Plus Jakarta Sans';font-size:12px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1b1500;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.2s;background:var(--bg2)}
.opt:has(input:checked){border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt input{accent-color:var(--gold);margin-top:3px;width:18px;height:18px}
.opt b{display:block}
.opt small{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.err{color:var(--err);font-size:13px}
/* pedido */
.steps{display:flex;gap:6px;margin:18px 0}
.steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.qr{background:#fff;border-radius:18px;padding:14px;width:240px;margin:8px auto}
.qr img{width:100%}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}
.b-ok{background:rgba(52,211,153,.12);color:var(--ok)}.b-warn{background:rgba(242,202,80,.12);color:var(--gold)}.b-err{background:rgba(248,113,113,.12);color:var(--err)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--gold);color:#1b1500;font-weight:600;padding:12px 18px;border-radius:12px;z-index:80;transition:.3s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:#3a1218;color:var(--err);border:1px solid rgba(248,113,113,.4)}
footer{border-top:1px solid var(--line);padding:36px 0 50px;color:var(--muted);font-size:13.5px;background:linear-gradient(to bottom,rgba(11,11,11,.86) 0,rgba(11,11,11,.97) 60px,var(--bg) 120px)}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
@media(max-width:760px){footer .cols{grid-template-columns:1fr}}
.mapa{margin-top:22px;max-width:340px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b0b0b;opacity:.85;transition:opacity .3s}
.mapa:hover{opacity:1}
.mapa iframe{display:block;width:100%;height:130px;border:0;filter:grayscale(.6) contrast(1.02) brightness(.88)}
.mapa-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px}
.mapa-bar span{color:var(--muted)}
.mapa-bar a{color:var(--gold);text-decoration:none;white-space:nowrap}
@media(max-width:760px){.mapa{max-width:none;margin-bottom:62px}}
.wa{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:#1faa59;display:flex;align-items:center;justify-content:center;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#snowfall{position:fixed;inset:0;display:block;pointer-events:none;z-index:0}
#butterflies{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
#bflyVig{position:fixed;inset:0;pointer-events:none;z-index:0}
.notice,header,main,footer{position:relative;z-index:1}
.skel{background:linear-gradient(90deg,#161616,#1f1f1f,#161616);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.center{text-align:center}
.closed{padding:90px 20px;text-align:center}
</style>
</head>

attribute vec2 a_corner;
attribute vec2 a_center;
attribute vec2 a_dir;
attribute vec4 a_ext;
attribute vec2 a_shade;

uniform vec2  uHalf;
uniform float uPxUnit;

varying vec2  v_local;
varying float v_fold;
varying float v_seed;
varying float v_aa;
varying vec2  v_shade;

#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec3 uBase;
uniform vec3 uAccent;

varying vec2  v_local;
varying float v_fold;
varying float v_seed;
varying float v_aa;
varying vec2  v_shade;

float hash11(float n) { return fract(sin(n * 78.233) * 43758.5453123); }

vec2 rot(vec2 p, float a) {

float sdEllipse(vec2 p, vec2 c, vec2 r) {

float sdLobe(vec2 p, vec2 c, vec2 r, float ang, float e) {

    vec2 pa = p - a, ba = b - a;

  /* props do preset enviado */
  const PROPS = {
    baseColor: '#FFE900',
    accentColor: '#0046FF',
    density: 140,
    size: 50,
    speed: 100,
    flap: 8,
    wander: 20,
    depth: 100,

      x: f(), y: f(), vx: f(), vy: f(), dx: f(), dy: f(),

      seed: f(), z: f(), panic: f(),
      order: new Int32Array(MAX_COUNT), ordered: -1, bx: 0, by: 0,

      sw.seed[i] = rnd();

      sw.dy[i] = Math.sin(sw.th[i]);

    for (let i = 0; i < MAX_COUNT; i++) {

      sw.y[i] = (((i + 1) * 0.41421356237309503) % 1) * 2 * by - by;

    const idx = [];
    for (let i = 0; i < n; i++) idx.push(i);
    idx.sort((a, b) => sw.z[a] - sw.z[b]);
    for (let i = 0; i < n; i++) sw.order[i] = idx[i];
    sw.ordered = n;
  }

  function parseColor(input, fb) {
    if (!input) return fb;
    const str = String(input).trim();
    if (str.charAt(0) === '#') {
      let hex = str.slice(1);
      if (hex.length === 3 || hex.length === 4) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];

        const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);

    speed: clampN(num(PROPS.speed, 50), 0, 100) / 50,

    wander: clampN(num(PROPS.wander, 55), 0, 100) / 100,
    depth: clampN(num(PROPS.depth, 60), 0, 100) / 100,
    blur: clampN(num(PROPS.blur, 100), 0, 300) / 100,

      const sn = Math.sin(sw.th[i]);

      const far = 1 - z;

        data[o + 5] = sw.dy[i];

        data[o + 7] = fold;
        data[o + 8] = sw.seed[i];

        data[o + 10] = alpha;
        data[o + 11] = sw.seed[i];

    gl.uniform1f(u('uPxUnit'), bh);
    gl.uniform3f(u('uBase'), base[0], base[1], base[2]);
    gl.uniform3f(u('uAccent'), accent[0], accent[1], accent[2]);

    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, o));
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, v.count * VERTS_PER_BUG);
    raf = requestAnimationFrame(render);
  };

  /* o canvas é só fundo (pointer-events:none), então o ponteiro é lido da janela */
  const track = (e) => {
    const r = canvas.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return;
    const fx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const fy = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    const asp = canvas.width / Math.max(1, canvas.height);
    ptr.x = (fx - 0.5) * asp;
    ptr.y = 0.5 - fy;
    ptr.onTarget = 1;
  };
  const onLeave = () => { ptr.onTarget = 0; };
  window.addEventListener('pointermove', track, { passive: true });
  window.addEventListener('pointerleave', onLeave);
  window.addEventListener('pointercancel', onLeave);

  raf = requestAnimationFrame(render);
})();

/* ===== Snow Fall (Originkit) — preset enviado pelo cliente ===== */
(function () {
  const P = { count: 744, speedMin: 1.5, speedMax: 0.9, wind: 0, windVariation: 2, sizeMin: 1.5, sizeMax: 0.5, opacityMin: 30, opacityMax: 91, direction: 'down', color: '#E0D02D' };
  const cv = document.getElementById('snowfall'); if (!cv) return;
  const g = cv.getContext('2d'); if (!g) return;
  let W = 0, H = 0, raf = 0, flakes = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rand = (a, b) => a + Math.random() * (b - a);
  const dirSign = P.direction === 'up' ? -1 : 1;
  const sLo = Math.min(P.speedMin, P.speedMax), sHi = Math.max(P.speedMin, P.speedMax);
  const rLo = Math.min(P.sizeMin, P.sizeMax), rHi = Math.max(P.sizeMin, P.sizeMax);
  const oLo = Math.min(P.opacityMin, P.opacityMax) / 100, oHi = Math.max(P.opacityMin, P.opacityMax) / 100;
  function build() {
    W = Math.max(1, Math.floor(window.innerWidth));
    H = Math.max(1, Math.floor(window.innerHeight));
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(0, Math.round(P.count));
    flakes = new Array(n);
    for (let i = 0; i < n; i++) flakes[i] = { x: Math.random() * W, y: Math.random() * H, r: rand(rLo, rHi), vy: rand(sLo, sHi), vx: rand(-1, 1), phase: Math.random() * Math.PI * 2, sway: rand(0.2, 0.9), alpha: rand(oLo, oHi) };
  }
  function draw() {
    g.clearRect(0, 0, W, H); g.fillStyle = P.color;
    for (let i = 0; i < flakes.length; i++) { const f = flakes[i]; g.globalAlpha = f.alpha; g.beginPath(); g.arc(f.x, f.y, f.r, 0, Math.PI * 2); g.fill(); }
    g.globalAlpha = 1;
  }
  function loop(t) {
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.y += f.vy * dirSign;
      f.x += P.wind + f.vx * P.windVariation + Math.sin(t * 0.0012 + f.phase) * f.sway;
      if (dirSign > 0 && f.y - f.r > H) { f.y = -f.r; f.x = Math.random() * W; }
      else if (dirSign < 0 && f.y + f.r < 0) { f.y = H + f.r; f.x = Math.random() * W; }
      if (f.x < -f.r) f.x = W + f.r; else if (f.x > W + f.r) f.x = -f.r;
    }
    draw(); raf = requestAnimationFrame(loop);
  }
  build(); draw(); raf = requestAnimationFrame(loop);
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { build(); draw(); }, 150); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) raf = requestAnimationFrame(loop); });
})();

function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast' + (bad ? ' bad' : ''), 3200); }
async function api(action, data = {}) {
  const names = [API.name].concat(API.names.filter(n => n !== API.name));
  let last = null;
  for (const n of names) {
    let r;
    try { r = await fetch(API.base + n, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: API.key, Authorization: 'Bearer ' + API.key }, body: JSON.stringify({ action, data }) }); }
    catch (e) { last = new Error('Sem conexão. Verifique sua internet e tente de novo.'); continue; }
    if (r.status === 404) { last = new Error('Loja indisponível no momento.'); continue; }
    try { localStorage.setItem('lbshop:fn', n); } catch (e) { }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || 'Não foi possível concluir agora.');
    return j.result;
  }
  throw last || new Error('Loja indisponível no momento.');
}

/* ===== mapa da loja (Google Maps) ===== */
function pintaMapa(c) {
  const el = $('#footMapa'); if (!el) return;
  const q = endFull(c.loja); if (!c.loja.endereco) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="mapa">
    <iframe src="${mapsEmbed(q)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa — ${esc(c.loja.nome)}" allowfullscreen></iframe>
    <div class="mapa-bar"><span>Nossa loja</span><a href="${mapsHref(q)}" target="_blank" rel="noopener">Como chegar →</a></div>
  </div>`;
}

function filtered() {
  const q = norm(S.q);
  let l = S.cat_.produtos.filter(p => (!S.cat || p.categoria === S.cat) && (!q || norm([p.nome, p.marca, p.linha, p.categoria, ...p.variacoes.map(v => v.nome + ' ' + v.sku)].join(' ')).includes(q)));
  const mn = p => Math.min(...p.variacoes.map(v => v.preco));
  const stock = p => p.variacoes.some(v => v.estoque > 0) ? 0 : 1;
  if (S.sort === 'menor') l.sort((a, b) => mn(a) - mn(b)); else if (S.sort === 'maior') l.sort((a, b) => mn(b) - mn(a)); else if (S.sort === 'az') l.sort((a, b) => a.nome.localeCompare(b.nome)); else l.sort((a, b) => stock(a) - stock(b) || (b.variacoes.some(v => v.promo) ? 1 : 0) - (a.variacoes.some(v => v.promo) ? 1 : 0));
  return l;
}
function card(p) {

  return `<article class="card rise" data-p="${esc(p.id)}"><div class="ph">${img(p.imagem, p.nome)}${promo ? `<span class="tag off">-${promo}%</span>` : p.selo ? `<span class="tag">${esc(p.selo)}</span>` : ''}${out ? '<span class="tag out">Esgotado</span>' : ''}</div>
    <div class="bd"><span class="brandname">${esc(p.marca)}</span><span class="nm">${esc(p.nome)}</span><div class="price">${vs.length > 1 && vs.some(v => v.preco !== min) ? '<span class="muted" style="font-size:12px">a partir de</span>' : ''}<b>${money(min)}</b>${best.promo ? `<s>${money(best.precoCheio)}</s>` : ''}</div></div></article>`;
}
function openProduct(id) {
  const p = S.cat_.produtos.find(x => x.id === id); if (!p) return;
  let v = p.variacoes.find(x => x.estoque > 0) || p.variacoes[0]; let qtd = 1;
  const m = $('#modal');
  const draw = () => {

    m.innerHTML = `<div class="pd"><div class="ph" style="position:relative">${img(v.imagem || p.imagem, p.nome)}<button class="x" data-close style="position:absolute;top:14px;right:14px;background:rgba(0,0,0,.55)">✕</button></div>

        <div class="price" style="padding:0"><b style="font-size:26px">${money(v.preco)}</b>${v.promo ? `<s>${money(v.precoCheio)}</s><span class="badge b-warn">-${v.promo}%</span>` : ''}</div>
        ${p.variacoes.length > 1 || (p.variacoes[0].nome && p.variacoes[0].nome !== 'Padrão') ? `<div><label class="lb">${p.tipo === 'cor' ? 'Cor' : p.tipo === 'volume' ? 'Tamanho' : p.tipo === 'fragrancia' ? 'Fragrância' : 'Opção'}</label><div class="vars">${p.variacoes.map(x => `<button data-v="${esc(x.id)}" class="${x.id === v.id ? 'on' : ''}" ${x.estoque <= 0 ? 'disabled' : ''}>${esc(x.nome)}</button>`).join('')}</div></div>` : ''}
        ${p.descricao ? `<p class="muted">${esc(p.descricao)}</p>` : ''}
        <p style="font-size:13px" class="${out ? 'err' : 'muted'}">${out ? 'Esgotado no momento' : v.estoque <= 3 ? `Últimas ${v.estoque} unidades` : 'Em estoque • validade conferida'}</p>
        <div class="row" style="justify-content:flex-start;gap:12px;margin-top:auto"><div class="qty"><button data-q="-1">−</button><span>${qtd}</span><button data-q="1">+</button></div><button class="btn btn-gold" style="flex:1" data-add ${out ? 'disabled' : ''}>Adicionar à sacola</button></div></div></div>`;
  };
  draw(); show('modal');
  m.onclick = e => {

    if (b.dataset.close != null) return hide();

  };
}

    <div class="stack" style="margin-top:14px;gap:6px"><div class="row"><span class="muted">Subtotal</span><span>${money(subtotal())}</span></div><div class="row"><span class="muted">Entrega</span><span id="fr">—</span></div><div class="row" style="font-size:20px;margin-top:6px"><b>Total</b><b class="gold" id="tt">${money(subtotal())}</b></div></div>
    ${c.config.pedidoMinimo && subtotal() < c.config.pedidoMinimo ? `<p class="err" style="margin-top:10px">Pedido mínimo de ${money(c.config.pedidoMinimo)}.</p>` : ''}
    <p class="err" id="coErr" style="margin-top:10px"></p><button class="btn btn-gold" style="width:100%;margin-top:12px" id="coBtn" ${pays.length && ship.length ? '' : 'disabled'}>Fazer pedido</button><p class="muted" style="font-size:12px;margin-top:10px;text-align:center">Seus dados são usados só para este pedido.</p></div></form></div>`;
}
function bindCheckout() {
  const f = $('#co'); if (!f) return; const c = S.cat_;
  const upd = () => { const tipo = (f.tipo && (f.querySelector('[name=tipo]:checked') || {}).value) || 'retirada'; $('#addr').hidden = tipo !== 'entrega'; const sub = subtotal(); const fr = tipo === 'entrega' ? (c.config.entregaGratisAcima && sub >= c.config.entregaGratisAcima ? 0 : c.config.taxaEntrega) : 0; $('#fr').textContent = tipo === 'entrega' ? (fr ? money(fr) : 'Grátis') : 'Retirada'; $('#tt').textContent = money(sub + fr); };
  f.addEventListener('change', upd); upd();
  f.onsubmit = async e => {
    e.preventDefault(); const fd = Object.fromEntries(new FormData(f)); const btn = $('#coBtn'); $('#coErr').textContent = '';
    if (digits(fd.telefone).length < 10) { $('#coErr').textContent = 'Informe seu WhatsApp com DDD.'; return; }
    if (fd.tipo === 'entrega' && (!fd.rua || !fd.numero || !fd.bairro)) { $('#coErr').textContent = 'Preencha o endereço de entrega.'; return; }
    store.set('me', { nome: fd.nome, telefone: fd.telefone, email: fd.email, cpf: fd.cpf, rua: fd.rua, numero: fd.numero, bairro: fd.bairro, complemento: fd.complemento, cidade: fd.cidade, cep: fd.cep });
    btn.disabled = true; btn.textContent = 'Enviando pedido…';
    try {
      const o = await api('pedido', { itens: S.cart.map(l => ({ variationId: l.id, qtd: l.qtd })), cliente: { nome: fd.nome, telefone: fd.telefone, email: fd.email, cpf: fd.cpf }, entrega: fd.tipo === 'entrega' ? { tipo: 'entrega', rua: fd.rua, numero: fd.numero, bairro: fd.bairro, complemento: fd.complemento, cidade: fd.cidade, cep: fd.cep, referencia: fd.referencia } : { tipo: 'retirada' }, pagamento: fd.pagamento, obs: fd.obs, siteUrl: location.href.split('#')[0] });
      S.cart = []; saveCart();
      const mine = store.get('orders', []); mine.unshift({ id: o.id, token: o.token, numero: o.numero, at: o.createdAt }); store.set('orders', mine.slice(0, 20));
      S.lastOrder = o; location.hash = `#/pedido/${o.id}?t=${o.token}`;
      if (o.pagamento.metodo === 'cartao' && o.pagamento.initPoint) setTimeout(() => { location.href = o.pagamento.initPoint; }, 900);
    } catch (err) { $('#coErr').textContent = err.message; btn.disabled = false; btn.textContent = 'Fazer pedido'; S.cat_ = null; await loadCatalog(true).catch(() => { }); }
  };
}
const ST = { novo: 'Pedido recebido', separando: 'Separando seus produtos', pronto: 'Pronto para retirada', em_entrega: 'Saiu para entrega', concluido: 'Concluído', cancelado: 'Cancelado' };
function viewOrder(o) {
  const c = S.cat_; const p = o.pagamento; const order = ['novo', 'separando', o.entrega.tipo === 'entrega' ? 'em_entrega' : 'pronto', 'concluido']; const idx = Math.max(0, order.indexOf(o.status));
  const payBox = p.metodo === 'pix' && p.status === 'pendente' && p.copiaECola ? `<div class="box center"><h3 style="justify-content:center">Pague com Pix</h3><p class="muted">Abra o app do seu banco, escolha Pix e leia o QR Code ou use o copia e cola.</p>${p.qrBase64 ? `<div class="qr"><img src="data:image/png;base64,${p.qrBase64}" alt="QR Code Pix"></div>` : ''}<button class="btn btn-ghost" id="cp" style="margin:6px auto 0">Copiar código Pix</button><p class="muted" style="font-size:12.5px;margin-top:12px">⏳ Aguardando pagamento — esta página atualiza sozinha.</p></div>`
    : p.metodo === 'cartao' && p.status === 'pendente' && p.initPoint ? `<div class="box center"><h3 style="justify-content:center">Pagamento com cartão</h3><p class="muted">Você será levada para o ambiente seguro do Mercado Pago.</p><a class="btn btn-gold" href="${esc(p.initPoint)}" style="margin-top:14px">Pagar ${money(o.total)}</a></div>`
    : p.status === 'pago' ? `<div class="box center"><span class="badge b-ok">✓ Pagamento aprovado</span><p class="muted" style="margin-top:10px">Obrigada! Já estamos cuidando do seu pedido.</p></div>`
    : p.status === 'expirado' ? `<div class="box center"><span class="badge b-err">Pagamento expirado</span><p class="muted" style="margin-top:10px">Fale com a gente pelo WhatsApp para concluir.</p></div>`
    : p.status === 'erro' ? `<div class="box center"><span class="badge b-err">Não conseguimos gerar o pagamento</span><p class="muted" style="margin-top:10px">Seu pedido foi recebido. Vamos te chamar no WhatsApp para combinar o pagamento.</p></div>`
    : `<div class="box center"><span class="badge b-warn">Pagamento na ${o.entrega.tipo === 'entrega' ? 'entrega' : 'retirada'}</span><p class="muted" style="margin-top:10px">Você paga quando ${o.entrega.tipo === 'entrega' ? 'receber' : 'vier buscar'} — dinheiro, Pix ou cartão.</p></div>`;
  const wa = c.loja.whatsapp ? `https://wa.me/${c.loja.whatsapp.length <= 11 ? '55' : ''}${c.loja.whatsapp}?text=${encodeURIComponent(`Olá! Fiz o pedido #${o.numero} pelo site.`)}` : '';
  return `<div class="wrap page" style="max-width:760px"><div class="center rise"><span class="badge ${o.status === 'cancelado' ? 'b-err' : 'b-ok'}">${o.status === 'cancelado' ? 'Pedido cancelado' : 'Pedido confirmado'}</span><h1 class="serif" style="font-size:36px;margin:12px 0 4px">Pedido #${o.numero}</h1><p class="muted">Obrigada, ${esc(o.cliente.nome.split(' ')[0])}! ${esc(ST[o.status] || '')}.</p></div>
    ${o.status !== 'cancelado' ? `<div class="steps">${order.map((k, i) => `<div class="${i <= idx ? 'on' : ''}" title="${ST[k]}"></div>`).join('')}</div><div class="row muted" style="font-size:11.5px;margin-top:-10px;margin-bottom:18px">${order.map(k => `<span>${ST[k]}</span>`).join('')}</div>` : ''}
    <div class="stack" style="gap:16px">${payBox}
    <div class="box"><h3>Itens</h3>${o.itens.map(i => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);font-size:14px"><span>${i.qtd}× ${esc(i.nome)}</span><b>${money(i.total)}</b></div>`).join('')}<div class="row" style="margin-top:10px"><span class="muted">Entrega</span><span>${o.entrega.tipo === 'entrega' ? (o.frete ? money(o.frete) : 'Grátis') : 'Retirada na loja'}</span></div><div class="row" style="font-size:19px;margin-top:6px"><b>Total</b><b class="gold">${money(o.total)}</b></div></div>
    <div class="box"><h3>${o.entrega.tipo === 'entrega' ? 'Entrega' : 'Retirada'}</h3><p class="muted">${o.entrega.tipo === 'entrega' ? `${esc(o.entrega.rua)}, ${esc(o.entrega.numero)} ${esc(o.entrega.complemento || '')} — ${esc(o.entrega.bairro)}, ${esc(o.entrega.cidade)}<br>${esc(c.config.prazoEntrega || '')}` : `<a href="${mapsHref(endFull(c.loja))}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(c.loja.endereco)} — ${esc(c.loja.cidade)}</a><br>${esc(c.config.prazoRetirada || '')}`}</p>${wa ? `<a class="btn btn-ghost" style="margin-top:14px" target="_blank" rel="noopener" href="${wa}">Falar no WhatsApp</a>` : ''}</div>
    <a href="#/" class="btn btn-gold">Voltar à loja</a></div></div>`;
}
async function routeOrder(id, token) {
  const app = $('#app'); app.innerHTML = `<div class="wrap page"><div class="skel" style="height:300px;border-radius:20px"></div></div>`;
  let alive = true; const my = location.hash;
  const tick = async () => {
    if (location.hash !== my) return;
    try {
      const o = await api('status', { id, token }); if (location.hash !== my) return;
      app.innerHTML = viewOrder(o);
      const cp = $('#cp'); if (cp) cp.onclick = () => navigator.clipboard.writeText(o.pagamento.copiaECola).then(() => toast('Código Pix copiado ✦'), () => toast('Copie manualmente.', true));
      if (['novo', 'separando', 'pronto', 'em_entrega'].includes(o.status) && (o.pagamento.status === 'pendente' || o.status !== 'concluido')) setTimeout(tick, o.pagamento.status === 'pendente' ? 5000 : 30000);
    } catch (e) { app.innerHTML = `<div class="wrap page center"><h1 class="serif" style="font-size:30px">Não encontramos este pedido</h1><p class="muted">${esc(e.message)}</p><a href="#/" class="btn btn-gold" style="margin-top:18px">Voltar à loja</a></div>`; }
  };
  tick();
}

/* ===== navegação ===== */
function show(w) { $('#ov').classList.add('on'); $('#' + w).classList.add('on'); document.body.style.overflow = 'hidden'; }
function hide() { ['ov', 'drawer', 'modal'].forEach(id => $('#' + id).classList.remove('on')); document.body.style.overflow = ''; }
$('#ov').onclick = hide;
document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
$('#cartBtn').onclick = () => S.cat_ && openCart();
$('#q').addEventListener('input', e => { S.q = e.target.value; if (!location.hash || location.hash === '#/' || location.hash === '#catalogo') { $('#app').innerHTML = viewHome(); bindHome(); } else location.hash = '#/'; });
/* ===== Skew in text (Originkit) — mola real, sem bibliotecas ===== */
function skewIn(el, o) {
  if (!el) return;
  if (el._skewRaf) cancelAnimationFrame(el._skewRaf);
  const { startX = -100, startSkewX = 30, startOpacity = 0, stiffness = 167, damping = 24, mass = 4.3 } = o || {};
  const fim = () => { el.style.transform = 'none'; el.style.opacity = '1'; };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return fim();
  let p = 0, v = 0, t0 = null;
  const passo = t => {
    if (t0 === null) t0 = t;
    let dt = Math.min((t - t0) / 1000, 1 / 30); t0 = t;
    const a = (-stiffness * (p - 1) - damping * v) / mass;
    v += a * dt; p += v * dt;
    el.style.transform = `translateX(${(startX * (1 - p)).toFixed(2)}px) skewX(${(startSkewX * (1 - p)).toFixed(2)}deg)`;
    el.style.opacity = String(startOpacity + (1 - startOpacity) * Math.min(1, Math.max(0, p)));
    if (Math.abs(p - 1) < 0.001 && Math.abs(v) < 0.001) { el._skewRaf = 0; return fim(); }
    el._skewRaf = requestAnimationFrame(passo);
  };
  el._skewRaf = requestAnimationFrame(passo);
}
function bindHero() {
  const hero = $('#hero'), box = $('#logo3d'); if (!hero || !box) return;
  const par = box.querySelector('.logo3d-par'), txt = hero.querySelector('.hero-txt');
  // 3D rotate 180º — automático a cada 5 segundos, e também no mouse/toque
  const inner = box.querySelector('.logo3d-inner');
  let deg = 0, giro = 0;
  const spin = () => { deg += 180; inner.style.transform = `rotateY(${deg}deg)`; };
  const liga = () => { clearInterval(giro); giro = setInterval(spin, 4000); };
  const desliga = () => clearInterval(giro);
  liga();
  box.addEventListener('mouseenter', () => { spin(); liga(); });
  box.addEventListener('click', () => { spin(); liga(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { desliga(); desligaSkew(); } else { liga(); ligaSkew(); } });
  // Skew-in text (Originkit) — mola com os valores do preset, repetindo a cada 4 segundos
  const titulo = $('#heroTitle');
  const skewCfg = { startX: 500, startSkewX: -70, startOpacity: 0, stiffness: 167, damping: 24, mass: 4.3 };
  let skewT = 0;
  const rodaSkew = () => skewIn(titulo, skewCfg);
  const ligaSkew = () => { clearInterval(skewT); skewT = setInterval(rodaSkew, 4000); };
  const desligaSkew = () => clearInterval(skewT);
  rodaSkew(); ligaSkew();
  // Parallax flutuante — o logo e o texto acompanham o mouse em profundidades diferentes
  if (matchMedia('(hover: hover)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    hero.addEventListener('mousemove', e => {
      const r = hero.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      par.style.transform = `translate3d(${(-x * 42).toFixed(1)}px, ${(-y * 30).toFixed(1)}px, 0) rotateY(${(-x * 12).toFixed(1)}deg) rotateX(${(y * 10).toFixed(1)}deg)`;
      if (txt) txt.style.transform = `translate3d(${(-x * 14).toFixed(1)}px, ${(-y * 10).toFixed(1)}px, 0)`;
    });
    hero.addEventListener('mouseleave', () => { par.style.transform = ''; if (txt) txt.style.transform = ''; });
  }
}
function bindHome() {
  const app = $('#app');
  bindHero();
  app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat === 'Todos' ? null : b.dataset.cat; app.innerHTML = viewHome(); bindHome(); document.getElementById('catalogo').scrollIntoView({ behavior: 'smooth' }); });
  app.querySelectorAll('[data-p]').forEach(c => c.onclick = () => openProduct(c.dataset.p));
  const so = $('#sort'); if (so) { so.value = S.sort; so.onchange = () => { S.sort = so.value; app.innerHTML = viewHome(); bindHome(); }; }
}
async function route() {
  hide(); const app = $('#app'); const h = location.hash || '#/';
  if (h === '#catalogo') return;
  if (!S.cat_) app.innerHTML = `<div class="wrap"><div class="skel" style="height:360px;border-radius:28px;margin:22px 0"></div><div class="grid">${'<div class="skel" style="aspect-ratio:.75;border-radius:16px"></div>'.repeat(8)}</div></div>`;
  try { await loadCatalog(); }
  catch (e) { app.innerHTML = `<div class="wrap closed"><h1 class="serif" style="font-size:32px">Não foi possível carregar a loja</h1><p class="muted" style="margin-top:8px">${esc(e.message)}</p><button class="btn btn-gold" style="margin-top:20px" onclick="location.reload()">Tentar de novo</button></div>`; return; }
  const m = h.match(/^#\/pedido\/([\w-]+)\?t=([\w]+)/);
  if (m) return routeOrder(m[1], m[2]);
  if (h.startsWith('#/checkout')) { app.innerHTML = viewCheckout(); bindCheckout(); window.scrollTo(0, 0); return; }
  app.innerHTML = viewHome(); bindHome();
  const pm = h.match(/^#\/p\/([\w-]+)/); if (pm) openProduct(pm[1]);
}
window.addEventListener('hashchange', route);
paintCartN(); route();
